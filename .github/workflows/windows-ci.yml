name: Windows CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/windows/**'
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      Solution_Name: src/windows/AzPin.Windows.sln
      App_Project: src/windows/AzPin.Windows/AzPin.Windows.csproj
      Core_Project: src/windows/AzPin.Windows.Core/AzPin.Windows.Core.csproj
      Test_Project: src/windows/AzPin.Windows.Tests/AzPin.Windows.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: |
          dotnet restore $env:App_Project -p:Platform=x64
          dotnet restore $env:Test_Project

      - name: Build release
        run: dotnet build $env:App_Project -c Release -p:Platform=x64 --no-restore -bl:artifacts\build.binlog

      - name: Test
        run: dotnet test $env:Test_Project -c Debug --no-restore --verbosity normal

      - name: Publish self-contained x64 bundle
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\win-x64'
          dotnet publish $env:App_Project `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            --self-contained true `
            -o "$publishDir" `
            -bl:artifacts\publish.binlog

      - name: Compress published bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/AzPin-Windows-win-x64-ci.zip

      - name: Upload binlogs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-binlogs
          path: artifacts/*.binlog
          if-no-files-found: ignore

      - name: Upload published bundle
        uses: actions/upload-artifact@v4
        with:
          name: AzPin-Windows-win-x64-ci
          path: artifacts/AzPin-Windows-win-x64-ci.zip
          if-no-files-found: error
