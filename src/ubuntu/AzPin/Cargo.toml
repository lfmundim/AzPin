[package]
name = "azpin"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.7"
adw = { package = "libadwaita", version = "0.5", features = ["v1_4"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
ksni = "0.2"
dirs = "5.0" # For XDG spec based directories

[package.metadata.deb]
maintainer = "Lucas Mundim <lucas@example.com>"
copyright = "2026, Lucas Mundim"
depends = "libgtk-4-1, libadwaita-1-0"
recommends = "azure-cli"
extended-description = "A native GTK4 app and indicator to manage Azure resources."
section = "utility"
priority = "optional"
assets = [
    ["target/release/azpin", "usr/bin/", "755"],
    ["assets/linux/com.lfmundim.azpin.desktop", "usr/share/applications/", "644"],
    ["assets/linux/icons/com.lfmundim.azpin.svg", "usr/share/icons/hicolor/scalable/apps/", "644"]
]
