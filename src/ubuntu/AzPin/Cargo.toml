[package]
name = "azpin"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.7"
libadwaita = "0.5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
ayatana-appindicator = "0.1" # Alternatively, use libappindicator or other appropriate crate
dirs = "5.0" # For XDG spec based directories
